name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: gx-lite

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm install

      - name: Build installers
        run: npx electron-builder --publish never

      - name: Save installers as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gx-lite-${{ matrix.os }}
          if-no-files-found: error
          path: |
            gx-lite/dist/*.exe
            gx-lite/dist/*.dmg

      - name: Attach installers to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v6
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            gx-lite/dist/*.exe
            gx-lite/dist/*.dmg
            gx-lite/dist/latest*.yml
            gx-lite/dist/*.blockmap
