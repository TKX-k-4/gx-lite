name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build (publishes a GitHub Release when run from a version tag)
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: gx-lite-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
