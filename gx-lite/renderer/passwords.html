<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Passwords</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<div class="pg">
  <h1>Passwords and autofill</h1>
  <p class="warn" id="warn" hidden>Secure storage is not available on this computer, so passwords cannot be saved.</p>

  <section class="card">
    <div class="bar">
      <input id="q" class="txt" placeholder="Search saved passwords" spellcheck="false" autocomplete="off">
      <button class="btn" id="add">Add</button>
      <button class="btn" id="import">Import CSV</button>
      <button class="btn" id="export">Export CSV</button>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
    </div>
    <form id="form" class="edit" hidden>
      <input id="f-url" class="txt" placeholder="Website, like https://example.com" spellcheck="false" autocomplete="off">
      <input id="f-user" class="txt" placeholder="Username or email" spellcheck="false" autocomplete="off">
      <div class="bar">
        <input id="f-pass" class="txt" type="password" placeholder="Password" autocomplete="new-password">
        <button class="btn" type="button" id="gen">Generate</button>
        <button class="btn" type="button" id="eye">Show</button>
      </div>
      <div class="bar"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="cancel">Cancel</button><span class="msg" id="form-msg"></span></div>
    </form>
    <div id="list"></div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>Addresses and other info</h2>
    <p class="sub">Used to fill forms when you click a field. Encrypted the same way as passwords. Card numbers are not stored.</p>
    <div class="grid" id="profile"></div>
    <div class="bar"><button class="btn primary" id="psave">Save info</button><span class="msg" id="pmsg"></span></div>
  </section>

  <section class="card">
    <h2>Sites that never save passwords</h2>
    <div id="never"></div>
  </section>
</div>
<script src="passwords.js"></script>
</body>
</html>
