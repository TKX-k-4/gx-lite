<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--accent:#3b82f6;--bg:#0e1424;--bg2:#16203a;--line:#1f2b4a;--dim:#8191b5;--text:#e8eefc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 "Source Code Pro Variable","Source Code Pro",ui-monospace,Menlo,Consolas,monospace}
.box{height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
header .t{font-weight:700;display:flex;align-items:center;gap:7px}
header .t i{font-style:normal;color:var(--accent)}
header .sp{flex:1}
.hb{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:7px;background:none;color:var(--dim);cursor:pointer;font:inherit}
.hb:hover{background:var(--bg2);color:var(--text)}
.hb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pg{flex:none;padding:7px 14px;color:var(--dim);font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;user-select:text}
.u{align-self:flex-end;max-width:86%;background:color-mix(in srgb,var(--accent) 24%,var(--bg));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--bg));padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.a{align-self:stretch;word-break:break-word}
.a p{margin:0 0 8px}.a ul{margin:0 0 8px;padding-left:18px}.a li{margin-bottom:4px}
.a .by{color:var(--dim);font-size:11px;margin-top:6px}
.lg{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
.lg::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.er{border:1px solid #6b2f2f;background:#2a1517;color:#f3b3b3;padding:10px 12px;border-radius:9px;word-break:break-word}
.er .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{margin:auto 0;text-align:center;color:var(--dim);padding:0 8px}
.empty h2{margin:0 0 6px;color:var(--text);font-size:15px}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.chips .btn{text-align:left;font-weight:500}
.cf{flex:none;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg));border-radius:10px;padding:12px;margin:0 14px 10px}
.cf .d{color:var(--dim);font-size:11.5px;margin-top:3px}
.cf .row{display:flex;gap:8px;margin-top:10px}
.dots{display:flex;gap:4px;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cmp{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px;border-top:1px solid var(--line)}
#in{flex:1;min-width:0;resize:none;max-height:120px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:8px 10px;font:inherit;line-height:1.4;outline:none}
#in:focus{border-color:var(--accent)}
#go{flex:none;height:34px;width:34px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
#go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#go:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="box">
  <header>
    <div class="t"><i>✦</i>Gemini</div>
    <div class="sp"></div>
    <button class="hb" id="clear" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="hb" id="close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="pg" id="pg"></div>
  <div id="msgs"></div>
  <div id="cf" hidden></div>
  <div class="cmp">
    <textarea id="in" rows="1" placeholder="Ask about this page, or tell Gemini to click something…" spellcheck="false"></textarea>
    <button id="go" title="Send"></button>
  </div>
</div>
<script src="assistant.js"></script>
</body>
</html>
