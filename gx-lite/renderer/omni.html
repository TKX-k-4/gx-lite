<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0e1424;color:#e8eefc;font:12.5px "Source Code Pro Variable","Source Code Pro",ui-monospace,Menlo,Consolas,monospace;user-select:none}
#list{box-sizing:border-box;height:100%;padding:5px 0;border:1px solid #1f2b4a;border-top:0}
.row{height:40px;display:flex;align-items:center;gap:12px;padding:0 14px;cursor:pointer}
.row:hover,.row.sel{background:#16203a}
.row.sel{box-shadow:inset 3px 0 0 #3b82f6}
svg{width:15px;height:15px;flex:none;color:#8191b5}
.t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.u{max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#8191b5}
</style>
</head>
<body>
<div id="list"></div>
<script src="omni.js"></script>
</body>
</html>
