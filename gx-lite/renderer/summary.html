<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Page summary</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="pages.css">
</head>
<body class="con">
<header>
  <strong>Page summary</strong>
  <button class="chip" id="again">Summarize again</button>
  <button class="chip" id="copy">Copy</button>
  <button class="chip" id="close">Close</button>
</header>
<div class="sum" id="body"></div>
<div class="ask">
  <input id="ask" placeholder="Ask about this page, or tell Gemini to click something…" spellcheck="false" autocomplete="off">
  <button class="chip" id="askgo">Ask</button>
</div>
<script src="summary.js"></script>
</body>
</html>
