<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0e1424;color:#e8eefc;font:12.5px "Source Code Pro Variable","Source Code Pro",ui-monospace,Menlo,Consolas,monospace;user-select:none}
#list{box-sizing:border-box;height:100%;padding:4px 0;border:1px solid #1f2b4a;border-radius:0}
.row{height:38px;display:flex;flex-direction:column;justify-content:center;padding:0 14px;cursor:pointer}
.row:hover{background:#16203a;box-shadow:inset 3px 0 0 #3b82f6}
.t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.s{color:#8191b5;font-size:11px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row.manage .t{color:#8191b5}
</style>
</head>
<body>
<div id="list"></div>
<script src="autofill.js"></script>
</body>
</html>
